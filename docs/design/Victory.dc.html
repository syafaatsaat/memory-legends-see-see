<div style="min-height: 100vh; background: #070B16; color: #EEF2FF; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 48px 16px">
  <section aria-labelledby="v-title" style="width: 100%; max-width: 640px; display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center">

    </div>
    <h1 id="v-title" style="margin: 0; font-family: Rajdhani, sans-serif; font-weight: 700; font-size: clamp(64px, 12vw, 120px); line-height: 0.9; letter-spacing: 0.08em; color: #F2C14E">VICTORY</h1>
    <p style="margin: 0; font-size: 18px; color: #C9D2EA">Medium cleared — 10 unique heroes, no repeats.</p>

    <div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #2A3658; border: 1px solid #2A3658">

      <div style="background: #121A30; padding: 18px 12px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; letter-spacing: 0.14em; color: #A3AECB">ROLES</span><span style="font-family: Rajdhani, sans-serif; font-weight: 700; font-size: 22px; line-height: 1.45">Mage · Marksman</span></div>
    </div>

    <div style="width: 100%; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 12px; letter-spacing: 0.14em; color: #A3AECB">YOUR PICKS, IN ORDER</span>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px">
        <span style="padding: 6px 12px; background: #121A30; font-size: 14px">Layla</span>
        <span style="padding: 6px 12px; background: #121A30; font-size: 14px">Pharsa</span>

        <span style="padding: 6px 12px; background: #121A30; font-size: 14px">Granger</span>
        <span style="padding: 6px 12px; background: #121A30; font-size: 14px">Wanwan</span>
        <span style="padding: 6px 12px; background: #121A30; font-size: 14px">Lunox</span>
        <span style="padding: 6px 12px; background: #121A30; font-size: 14px">Beatrix</span>
        <span style="padding: 6px 12px; background: #121A30; font-size: 14px">Moskov</span>
